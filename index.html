<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pop the Balloons</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ========================= -->
<!-- START SCREEN -->
<!-- ========================= -->

<div id="menu">

<img
id="logo"
src="assets/images/logo.png">

<button id="playBtn">

PLAY

</button>

</div>

<!-- ========================= -->
<!-- GAME -->
<!-- ========================= -->

<div id="game">

<img
id="background"
src="assets/images/background.png">

<div id="topBar">

<div id="instruction">

Pop the <b>PINK</b> balloon!

</div>

<div id="score">

⭐ <span id="points">0</span>/6

</div>

</div>

<!-- ========================= -->
<!-- BALLOONS -->
<!-- ========================= -->

<div class="balloon purple">

<img src="assets/images/purple.png">

</div>

<div class="balloon brown">

<img src="assets/images/brown.png">

</div>

<div class="balloon pink">

<img src="assets/images/pink.png">

</div>

<div class="balloon white">

<img src="assets/images/white.png">

</div>

<div class="balloon black">

<img src="assets/images/black.png">

</div>

<div class="balloon grey">

<img src="assets/images/grey.png">

</div>

<!-- ========================= -->
<!-- FINGER -->
<!-- ========================= -->

<img
id="finger"
src="assets/images/finger.png">

</div>

<!-- ========================= -->
<!-- WIN SCREEN -->
<!-- ========================= -->

<div id="winScreen">

<h1>

🌟 Great Job! 🌟

</h1>

<button id="againBtn">

Play Again

</button>

</div>

<script src="script.js"></script>

</body>

</html>
